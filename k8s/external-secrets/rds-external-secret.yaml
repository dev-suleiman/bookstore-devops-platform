apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-secret
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password | urlquery }}@{{ .host }}:5432/{{ .database }}?schema=public&sslmode=require"
  dataFrom:
    - extract:
        key: bookstore/rds/credentials